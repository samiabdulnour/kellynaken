# Fly.io settings for the site plus the play-together server.
# The co-op room lives in one process's memory, so this must run as exactly ONE machine:
# deploy with `fly deploy --ha=false` and keep `fly scale count 1`.
app = "kellynaken"
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
